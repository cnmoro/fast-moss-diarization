[package]
name = "fmd-cli"
description = "Command line interface and benchmark for the fast MOSS diarization engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fmd"
path = "src/main.rs"

[dependencies]
fmd-core = { path = "../fmd-core" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[features]
default = []
cuda = ["fmd-core/cuda"]
cudnn = ["fmd-core/cudnn"]
metal = ["fmd-core/metal"]
mkl = ["fmd-core/mkl"]
